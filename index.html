<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task board</title>
<style>
  /* Tuned for a ~800px-wide embed: single column, active queue on top. */
  :root {
    --bg: #f0f1f3;
    --card: #ffffff;
    --line: #e6e8eb;
    --ink: #16181d;
    --muted: #8b9098;
    --accent: #2b6cf6;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 10px; background: var(--bg); color: var(--ink);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .app {
    max-width: 820px; margin: 0 auto; background: var(--card);
    border-radius: 10px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.07);
  }
  header {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 13px; border-bottom: 1px solid var(--line);
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #3fbf63; flex: none; }
  h1 { font-size: 14px; font-weight: 650; margin: 0; letter-spacing: -.15px; }
  .sub {
    font: 11px var(--mono); color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  header a { margin-left: auto; font-size: 11px; color: var(--muted); text-decoration: none; flex: none; }
  header a:hover { color: var(--accent); }

  .bar {
    display: flex; align-items: baseline; gap: 7px;
    padding: 7px 13px; border-bottom: 1px solid var(--line); background: #fafbfc;
  }
  .bar .label { font: 10px var(--mono); letter-spacing: .09em; color: var(--muted); text-transform: uppercase; }
  .bar .count { font: 10px var(--mono); color: var(--muted); }
  .bar .sync.pending { color: #a8791a; }
  .bar .sync.syncing { color: var(--accent); }
  .bar .sync.error { color: #b3261e; font-weight: 600; }
  .controls { display: flex; gap: 6px; padding: 8px 13px; border-bottom: 1px solid var(--line); }
  input, select {
    font: 12px inherit; padding: 4px 7px; border: 1px solid var(--line);
    border-radius: 6px; background: #fff; color: var(--ink); outline: none; min-width: 0;
  }
  input { flex: 1; }
  input:focus, select:focus { border-color: var(--accent); }
  select { font-family: var(--mono); font-size: 11px; color: var(--muted); flex: none; }

  .row {
    display: grid; grid-template-columns: 15px 22px 1fr auto auto; gap: 1px 8px;
    padding: 7px 13px; border-bottom: 1px solid var(--line); cursor: pointer;
    align-items: start;
  }
  .row:hover { background: #fafbfc; }
  .row.open { background: #f7f8fa; }
  .rank { grid-row: span 2; font: 10px var(--mono); color: var(--muted); padding-top: 2px; }
  .title {
    font-size: 12.5px; font-weight: 500; line-height: 1.35;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .row.open .title { white-space: normal; }
  .age { font: 10px var(--mono); color: var(--muted); text-align: right; padding-top: 1px; }
  .meta {
    grid-column: 3 / 6; font: 10px var(--mono); color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .mv { grid-row: span 2; display: flex; gap: 2px; align-self: center; }
  .mv button {
    width: 19px; height: 19px; padding: 0; line-height: 1;
    border: 1px solid var(--line); border-radius: 4px; background: #fff;
    color: var(--muted); font-size: 9px; cursor: pointer;
  }
  .mv button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .mv button:disabled { opacity: .3; cursor: default; }

  /* Expanded issue body */
  .body {
    padding: 11px 13px 13px 35px; border-bottom: 1px solid var(--line);
    background: #f7f8fa; font-size: 12px; line-height: 1.5;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .body pre {
    margin: 7px 0; padding: 8px 9px; background: #eceef1; border-radius: 5px;
    font: 11px var(--mono); white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .body code { font: 11px var(--mono); background: #eceef1; padding: 1px 3px; border-radius: 3px; }
  .body a { color: var(--accent); }
  .body .none { color: var(--muted); font-style: italic; }
  .body .open-gh { display: inline-block; margin-top: 9px; font: 10px var(--mono); color: var(--muted); }

  /* Active queue — same row shape as the backlog, tinted so the split reads
     without adding a heavier container. */
  .queue { background: #fbfcfe; }
  .queue .bar { background: #f4f7fd; }
  .queue .row.is-active { background: #f7faff; }
  .queue .row.is-done { opacity: .62; }
  .queue .row.is-active .title { font-weight: 600; }
  .pill {
    display: inline-block; padding: 1px 5px; border-radius: 3px; background: var(--accent);
    color: #fff; font: 9px var(--mono); letter-spacing: .06em; font-weight: 600;
  }
  .pill.todo { background: #e7e9ec; color: #6b7079; }
  .pill.queued { background: #d98324; }
  .pill.done { background: #2e9e5b; }
  .pill.blocked { background: #b3261e; }
  .cancel {
    font: 9.5px var(--mono); color: var(--muted); text-decoration: none;
    border-bottom: 1px dotted currentColor; margin-left: 7px;
  }
  .cancel:hover { color: #b3261e; }
  .pick { grid-row: span 2; align-self: center; margin: 0; cursor: pointer; }
  .pick-cell { grid-row: span 2; }
  .row.picked { background: #eef4ff; }
  .bchip {
    display: inline-block; margin-left: 7px; padding: 0 4px; border-radius: 3px;
    font: 9px var(--mono); font-weight: 600; color: #fff;
  }
  .seltools {
    display: flex; align-items: center; gap: 7px;
    padding: 7px 13px; border-bottom: 1px solid var(--line); background: #eef4ff;
  }
  .seltools .n { font: 10px var(--mono); color: var(--accent); font-weight: 600; }
  .seltools .grow { margin-left: auto; }
  .seltools .note { font: 10px var(--mono); color: var(--muted); }
  .act {
    font: 9.5px var(--mono); color: var(--muted); text-decoration: none;
    margin-left: 7px; padding: 1px 6px; border: 1px solid var(--line);
    border-radius: 4px; background: #fff; cursor: pointer;
  }
  .act:hover { border-color: var(--accent); color: var(--accent); }

  .empty { padding: 18px 13px; text-align: center; color: var(--muted); font-size: 12px; }
  .empty .hint { font: 10px var(--mono); margin-top: 5px; opacity: .8; }
  .banner {
    padding: 6px 13px; background: #fff8e6; border-bottom: 1px solid #f0e2b8;
    font: 10px var(--mono); color: #7a5c12;
  }
  .err { padding: 14px; color: #b3261e; font: 11px var(--mono); }

  .btn {
    font: 10px var(--mono); padding: 4px 9px; border-radius: 6px;
    border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer;
  }
  .btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover:not(:disabled) { color: #fff; opacity: .9; }
  .btn:disabled { opacity: .5; cursor: default; }
  header .btn { margin-left: auto; }
  header .btn + a { margin-left: 10px; }

  .veil {
    position: fixed; inset: 0; z-index: 20; background: rgba(18,20,24,.34);
    display: flex; align-items: flex-start; justify-content: center; padding: 8vh 12px 12px;
  }
  .sheet {
    background: #fff; border-radius: 10px; width: min(520px, 100%);
    box-shadow: 0 10px 34px rgba(0,0,0,.22); overflow: hidden;
  }
  .sheet .fields { padding: 12px 13px; display: flex; flex-direction: column; gap: 8px; }
  .sheet input[type=text], .sheet textarea {
    font: 12.5px inherit; padding: 6px 8px; border: 1px solid var(--line);
    border-radius: 6px; outline: none; width: 100%; color: var(--ink);
  }
  .sheet textarea { min-height: 96px; resize: vertical; font-size: 12px; }
  .sheet input:focus, .sheet textarea:focus { border-color: var(--accent); }
  .sheet label.check { display: flex; align-items: center; gap: 6px; font: 10.5px var(--mono); color: var(--muted); }
  .sheet .foot {
    display: flex; gap: 8px; align-items: center; padding: 10px 13px;
    border-top: 1px solid var(--line); background: #fafbfc;
  }
  .sheet .foot .grow { margin-left: auto; }
  .sheet .msg { font: 10px var(--mono); color: #b3261e; }
</style>
</head>
<body>
<div class="app" id="app"><div class="empty">loading…</div></div>

<script>
// Same-origin when served by server.mjs; the published artifact injects the
// public tunnel origin here so it talks to the live board.
const API = window.__API__ ?? ''

// The active queue is defined by Status, not by position. Anything staged or
// running belongs there; anything just-finished lingers briefly so you can see
// it land before it drops off.
const QUEUE_STATUSES = ['Queued for Dev', 'In Progress']
const DONE_WINDOW_MS = 15 * 60 * 1000
const POLL_MS = 5000
const NEW_TASK_REPO = window.__REPO__ ?? 'freeflow-community/flow'

const STATUS_PILL = {
  'Queued for Dev': { cls: ' queued', text: 'QUE' }, // 22px rank column won't take the full word
  'In Progress': { cls: '', text: 'RUN' },
  'Done': { cls: ' done', text: 'DONE' },
  'Blocked': { cls: ' blocked', text: 'BLK' },
  'Todo': { cls: ' todo', text: 'TODO' },
}

const SYNC_LABEL = { pending: 'unsaved', syncing: 'saving…', error: 'save failed' }
const SYNC_DELAY_MS = 700

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))

// Deliberately tiny markdown: enough for issue bodies (fences, inline code,
// bold, links, headings) without pulling in a dependency.
function md(src) {
  const fences = []
  const s = esc(src)
    .replace(/```[\w-]*\n([\s\S]*?)```/g, (_, code) => '␀' + (fences.push(code) - 1) + '␀')
    .replace(/`([^`\n]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/^#{1,6}\s+(.+)$/gm, '<strong>$1</strong>')
  return s.replace(/␀(\d+)␀/g, (_, i) => `<pre>${fences[i]}</pre>`)
}

function age(iso) {
  const d = Math.floor((Date.now() - new Date(iso)) / 86400000)
  return d < 1 ? 'today' : d + 'd'
}

function ago(iso) {
  const m = Math.floor((Date.now() - new Date(iso)) / 60000)
  return m < 1 ? 'just now' : m + 'm ago'
}

function metaLine(it) {
  const bits = ['#' + it.number, it.repo.split('/')[1]]
  for (const l of it.labels) bits.push(l.name)
  if (it.assignees.length) bits.push('@' + it.assignees[0])
  return bits.join(' · ')
}

let BOARD = null
let filter = { q: '', status: 'all' }
const expanded = new Set() // issue numbers, kept across re-renders
let syncTimer = null
let syncState = 'idle' // idle | pending | syncing | error

// Statuses we have written but not yet seen confirmed. A poll that started
// before the write — or that reads the server's 3s status cache — would
// otherwise overwrite the optimistic value and snap the row back.
const selected = new Set()   // item ids ticked for linking
let linkBusy = ''            // label shown while a link/unlink is in flight

// Batches are drawn from a small cycling palette; the number itself is shown
// in the chip, so the colour only has to separate neighbours.
const BATCH_COLOURS = ['#d98324', '#2b6cf6', '#2e9e5b', '#8b5cf6', '#c2405f']
const batchColour = (b) => BATCH_COLOURS[(Math.round(b) - 1) % BATCH_COLOURS.length]
const batchMates = (it) =>
  it.batch == null ? [it.id] : BOARD.items.filter((x) => x.batch === it.batch).map((x) => x.id)

const pendingWrites = new Map() // itemId -> { status, expires }
const WRITE_GRACE_MS = 30_000

// --- queue membership -------------------------------------------------------

function doneRecently(it) {
  return it.status === 'Done' && it.statusAt && Date.now() - new Date(it.statusAt) < DONE_WINDOW_MS
}

const inQueue = (it) => QUEUE_STATUSES.includes(it.status) || doneRecently(it)

function partition() {
  return {
    queue: BOARD.items.filter(inQueue),
    backlog: BOARD.items.filter((it) => !inQueue(it)),
  }
}

// --- rendering --------------------------------------------------------------

function rowHTML(it, rank, { inQ = false, movable = false, first = false, last = false } = {}) {
  const open = expanded.has(it.number)
  const pill = STATUS_PILL[it.status]

  // Only a staged task can be pulled back. Once an agent has started or
  // finished it, yanking it out from under them is not a UI decision.
  const cancel = inQ && it.status === 'Queued for Dev' && !BOARD.stale
    ? `<a class="cancel" data-cancel="${esc(it.id)}" title="Back to Todo, out of the queue">cancel</a>`
    : ''

  // Any backlog row can be staged, including a Done one being redone.
  const queue = !inQ && !BOARD.stale
    ? `<a class="act" data-queue="${esc(it.id)}" title="Stage for the active queue">queue</a>`
    : ''

  const mv = movable
    ? `<div class="mv">
         <button data-move="up" data-id="${esc(it.id)}" ${first ? 'disabled' : ''} title="Move up">▲</button>
         <button data-move="down" data-id="${esc(it.id)}" ${last ? 'disabled' : ''} title="Move down">▼</button>
       </div>`
    : '<div class="mv"></div>'

  const when = inQ && it.statusAt ? ago(it.statusAt) : age(it.createdAt)
  const picked = selected.has(it.id)
  const edge = it.batch != null ? `box-shadow: inset 3px 0 0 ${batchColour(it.batch)};` : ''
  const chip = it.batch != null
    ? `<span class="bchip" style="background:${batchColour(it.batch)}">B${Math.round(it.batch)}</span>` : ''

  return `<div class="row${it.status === 'In Progress' ? ' is-active' : ''}${open ? ' open' : ''}${doneRecently(it) ? ' is-done' : ''}${picked ? ' picked' : ''}" data-num="${it.number}" style="${edge}">
      <div class="pick-cell">${inQ && !BOARD.stale
        ? `<input type="checkbox" class="pick" data-pick="${esc(it.id)}"${picked ? ' checked' : ''}>` : ''}</div>
      <div class="rank">${pill && (inQ || it.status !== 'Todo')
        ? `<span class="pill${pill.cls}">${pill.text}</span>` : esc(rank)}</div>
      <div class="title">${esc(it.title)}</div>
      <div class="age">${esc(when)}</div>
      ${mv}
      <div class="meta">${esc(metaLine(it))}${chip}${cancel}${queue}</div>
    </div>
    ${open ? `<div class="body">${it.body.trim() ? md(it.body) : '<span class="none">No description.</span>'}
      <a class="open-gh" href="${esc(it.url)}" target="_blank" rel="noopener">open #${it.number} on GitHub →</a></div>` : ''}`
}

function matches(it) {
  const q = filter.q.toLowerCase()
  if (filter.status !== 'all' && (it.status ?? '—') !== filter.status) return false
  if (!q) return true
  return (it.title + ' ' + metaLine(it)).toLowerCase().includes(q)
}

function render() {
  const { queue, backlog: allBacklog } = partition()
  // A selected task can leave the queue under us — cancelled, or finished and
  // aged out. Don't keep it selected with no checkbox to untick.
  const live = new Set(queue.map((it) => it.id))
  for (const id of selected) if (!live.has(id)) selected.delete(id)
  const backlog = allBacklog.filter(matches)
  const statuses = [...new Set(BOARD.items.map((it) => it.status ?? '—'))]
  const reorderable = !filter.q && filter.status === 'all' && !BOARD.stale

  const app = document.getElementById('app')
  const focused = document.activeElement
  const caret = focused?.id === 'q' ? focused.selectionStart : null

  app.innerHTML = `
    <header>
      <span class="dot"></span>
      <h1>Task board</h1>
      <span class="sub">${esc(BOARD.title)}</span>
      ${BOARD.stale ? '' : '<button class="btn" id="new-task">+ New task</button>'}
      <a href="${esc(BOARD.url)}" target="_blank">GitHub →</a>
    </header>
    ${BOARD.stale ? `<div class="banner">snapshot — no live server, editing disabled</div>` : ''}

    <section class="queue">
      <div class="bar">
        <span class="label">Active queue</span>
        <span class="count">${queue.length ? queue.length + ' active' : 'empty'}</span>
      </div>
      ${selected.size ? `<div class="seltools">
        <span class="n">${selected.size} selected</span>
        <span class="note">${linkBusy || (selected.size < 2 ? 'pick at least two to link' : '')}</span>
        <span class="grow"></span>
        <button class="btn primary" id="sel-link" ${selected.size < 2 || linkBusy ? 'disabled' : ''}>Link</button>
        <button class="btn" id="sel-unlink" ${linkBusy || ![...selected].some((id) => BOARD.items.find((x) => x.id === id)?.batch != null) ? 'disabled' : ''}>Unlink</button>
        <button class="btn" id="sel-clear" ${linkBusy ? 'disabled' : ''}>Clear</button>
      </div>` : ''}
      ${queue.length
        ? queue.map((it) => rowHTML(it, null, { inQ: true })).join('')
        : `<div class="empty">Nothing queued<div class="hint">set a task to “Queued for Dev”</div></div>`}
    </section>

    <section class="backlog">
      <div class="bar">
        <span class="label">Backlog</span>
        <span class="count">${backlog.length} unscheduled</span>
        ${filter.q || filter.status !== 'all' ? '<span class="count">· reorder needs an unfiltered list</span>' : ''}
        ${SYNC_LABEL[syncState] ? `<span class="count sync ${syncState}">· ${SYNC_LABEL[syncState]}</span>` : ''}
      </div>
      <div class="controls">
        <input id="q" placeholder="Search" value="${esc(filter.q)}">
        <select id="status">
          <option value="all">All</option>
          ${statuses.map((s) => `<option value="${esc(s)}"${s === filter.status ? ' selected' : ''}>${esc(s)}</option>`).join('')}
        </select>
      </div>
      <div id="list">${backlog.map((it, i) => rowHTML(it, i + 1, {
        movable: reorderable, first: i === 0, last: i === backlog.length - 1,
      })).join('') || '<div class="empty">nothing matches</div>'}</div>
    </section>`

  app.querySelectorAll('.row').forEach((r) =>
    r.addEventListener('click', () => {
      const n = Number(r.dataset.num)
      expanded.has(n) ? expanded.delete(n) : expanded.add(n)
      render()
    }))

  app.querySelectorAll('[data-pick]').forEach((c) =>
    c.addEventListener('click', (e) => {
      e.stopPropagation() // don't also toggle the row open
      const id = c.dataset.pick
      selected.has(id) ? selected.delete(id) : selected.add(id)
      render()
    }))

  document.getElementById('sel-link')?.addEventListener('click', () => linkSelected('link'))
  document.getElementById('sel-unlink')?.addEventListener('click', () => linkSelected('unlink'))
  document.getElementById('sel-clear')?.addEventListener('click', () => { selected.clear(); render() })

  app.querySelectorAll('[data-cancel]').forEach((a) =>
    a.addEventListener('click', (e) => {
      e.stopPropagation() // don't also toggle the row open
      changeStatus(a.dataset.cancel, 'Todo')
    }))

  app.querySelectorAll('[data-queue]').forEach((a) =>
    a.addEventListener('click', (e) => {
      e.stopPropagation()
      changeStatus(a.dataset.queue, QUEUE_STATUSES[0])
    }))

  app.querySelectorAll('[data-move]').forEach((b) =>
    b.addEventListener('click', (e) => {
      e.stopPropagation()
      moveLocal(b.dataset.id, b.dataset.move)
    }))

  document.getElementById('new-task')?.addEventListener('click', openNewTask)

  const q = document.getElementById('q')
  if (caret !== null) { q.focus(); q.setSelectionRange(caret, caret) }
  q.addEventListener('input', (e) => { filter.q = e.target.value; render() })
  document.getElementById('status').addEventListener('change', (e) => { filter.status = e.target.value; render() })
}

// --- reordering -------------------------------------------------------------

// Reordering is applied locally and rendered immediately; the board is pushed
// to GitHub once the user stops clicking. A round trip costs ~2.5s, far too
// slow to sit behind a button press.
//
// Neighbours are taken from the backlog, not from raw board order — queue items
// can sit between two backlog rows, and swapping across one would move a task
// the user can't even see in this list.
function moveLocal(itemId, direction) {
  const { backlog } = partition()
  const bi = backlog.findIndex((it) => it.id === itemId)
  const to = direction === 'up' ? bi - 1 : bi + 1
  if (bi < 0 || to < 0 || to >= backlog.length) return

  const items = BOARD.items
  const a = items.indexOf(backlog[bi])
  const b = items.indexOf(backlog[to])
  ;[items[a], items[b]] = [items[b], items[a]]

  syncState = 'pending'
  render()
  clearTimeout(syncTimer)
  syncTimer = setTimeout(sync, SYNC_DELAY_MS)
}

async function sync() {
  syncState = 'syncing'
  render()
  try {
    const res = await fetch(API + '/api/reorder', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ order: BOARD.items.map((it) => it.id) }),
    })
    const out = await res.json()
    if (!res.ok) throw new Error(out.error ?? res.statusText)
    syncState = 'idle'
    render()
  } catch (err) {
    // Don't leave the UI showing an order GitHub never accepted.
    syncState = 'error'
    alert('could not save the new order: ' + err.message + '\n\nReloading the board.')
    await load()
  }
}

// --- cancel -----------------------------------------------------------------

// Queue membership is a Status now, so moving a task in or out of the queue is
// a status write rather than a reorder. Applied optimistically and reverted if
// GitHub rejects it.
async function changeStatus(itemId, status) {
  const seed = BOARD.items.find((x) => x.id === itemId)
  if (!seed) return

  // A batch is one unit of work, so queueing or cancelling any member moves
  // all of them — half a batch in the queue would be a lie to the agent.
  const ids = batchMates(seed)
  const now = new Date().toISOString()
  const prev = new Map()
  for (const id of ids) {
    const it = BOARD.items.find((x) => x.id === id)
    prev.set(id, { status: it.status, statusAt: it.statusAt })
    it.status = status
    it.statusAt = now
    pendingWrites.set(id, { status, expires: Date.now() + WRITE_GRACE_MS })
  }
  render()

  try {
    const res = await fetch(API + '/api/set-status', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ itemIds: ids, status }),
    })
    const out = await res.json()
    if (!res.ok) throw new Error(out.error ?? res.statusText)
    pollStatus() // the write busted the server cache, so this confirms immediately
  } catch (err) {
    for (const id of ids) {
      pendingWrites.delete(id)
      Object.assign(BOARD.items.find((x) => x.id === id), prev.get(id))
    }
    render()
    alert(`could not set status to "${status}": ` + err.message)
  }
}

// --- linking ----------------------------------------------------------------

// Linking writes a shared Batch number and pulls the members adjacent, so a
// batch reads as one block. Both take a couple of seconds — the reorder is
// several mutations — so the toolbar says what's happening.
async function linkSelected(kind) {
  if (linkBusy) return
  linkBusy = kind === 'link' ? 'linking…' : 'unlinking…'
  render()
  try {
    const res = await fetch(API + '/api/' + kind, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ itemIds: [...selected] }),
    })
    const out = await res.json()
    if (!res.ok) throw new Error(out.error ?? res.statusText)
    selected.clear()
    linkBusy = ''
    await load()
  } catch (err) {
    linkBusy = ''
    render()
    alert('could not ' + kind + ': ' + err.message)
  }
}

// --- new task ---------------------------------------------------------------

// The sheet lives outside #app so the 5s poll's re-render can't rebuild it —
// and wipe what you're halfway through typing.
function openNewTask() {
  if (document.querySelector('.veil')) return

  const veil = document.createElement('div')
  veil.className = 'veil'
  veil.innerHTML = `
    <div class="sheet">
      <div class="bar"><span class="label">New task</span><span class="count">${esc(NEW_TASK_REPO)}</span></div>
      <div class="fields">
        <input type="text" id="nt-title" placeholder="Title" autocomplete="off">
        <textarea id="nt-body" placeholder="Description (markdown)"></textarea>
        <label class="check"><input type="checkbox" id="nt-queue"> queue it immediately</label>
      </div>
      <div class="foot">
        <span class="msg" id="nt-msg"></span>
        <span class="grow"></span>
        <button class="btn" id="nt-cancel">Cancel</button>
        <button class="btn primary" id="nt-create">Create</button>
      </div>
    </div>`
  document.body.appendChild(veil)

  const $ = (id) => veil.querySelector('#' + id)
  const close = () => veil.remove()

  $('nt-title').focus()
  $('nt-cancel').addEventListener('click', close)
  veil.addEventListener('click', (e) => { if (e.target === veil) close() })
  veil.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') close()
    // Enter submits from the title field; the body needs newlines, so it takes ⌘/Ctrl-Enter.
    if (e.key === 'Enter' && (e.target.id === 'nt-title' || e.metaKey || e.ctrlKey)) create()
  })
  $('nt-create').addEventListener('click', create)

  async function create() {
    const title = $('nt-title').value.trim()
    if (!title) { $('nt-msg').textContent = 'a title is required'; $('nt-title').focus(); return }

    $('nt-create').disabled = $('nt-cancel').disabled = true
    $('nt-create').textContent = 'Creating…'
    $('nt-msg').textContent = ''
    try {
      const res = await fetch(API + '/api/new-task', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ title, body: $('nt-body').value, queue: $('nt-queue').checked }),
      })
      const out = await res.json()
      if (!res.ok) throw new Error(out.error ?? res.statusText)
      close()
      await load() // the new item won't be in the board we're holding
    } catch (err) {
      $('nt-msg').textContent = String(err.message).slice(0, 90)
      $('nt-create').disabled = $('nt-cancel').disabled = false
      $('nt-create').textContent = 'Create'
    }
  }
}

// --- polling ----------------------------------------------------------------

// Status changes out from under us (an agent claims a task, finishes it), so
// poll for it. This only ever patches status — never order — so it can't fight
// an unsaved local reorder.
function queueSignature() {
  // Includes membership so a Done item ageing past the window redraws even
  // though no status actually changed.
  return BOARD.items.map((it) => `${it.id}:${it.status}:${it.batch}:${inQueue(it) ? 1 : 0}`).join('|')
}

async function pollStatus() {
  if (!BOARD || BOARD.stale || document.hidden) return
  try {
    const res = await fetch(API + '/api/status')
    if (!res.ok) return
    const map = await res.json()
    const before = queueSignature()
    for (const it of BOARD.items) {
      const next = map[it.id]
      if (!next) continue

      const pending = pendingWrites.get(it.id)
      if (pending) {
        if (next.status === pending.status) pendingWrites.delete(it.id) // server caught up
        else if (Date.now() < pending.expires) continue                 // hold the optimistic value
        else pendingWrites.delete(it.id)                                // gave it long enough; trust the server
      }

      it.status = next.status
      it.statusAt = next.at
      it.batch = next.batch ?? null
    }
    if (queueSignature() !== before) render() // re-rendering blindly would fight the search box
  } catch {
    // A poll failing is not worth interrupting anyone over; the next one retries.
  }
}

// --- boot -------------------------------------------------------------------

async function load() {
  const res = await fetch(API + '/api/board')
  if (!res.ok) throw new Error((await res.json()).error ?? res.statusText)
  BOARD = await res.json()
  render()
}

async function boot() {
  try {
    await load()
  } catch (err) {
    // No server (e.g. opened as a standalone artifact) — fall back to the
    // snapshot baked in at publish time, and say so.
    if (window.__SEED__) { BOARD = { ...window.__SEED__, stale: true }; render() }
    else document.getElementById('app').innerHTML =
      `<div class="err">could not load board: ${esc(err.message)}</div>`
  }
}
boot()
setInterval(pollStatus, POLL_MS)
</script>
</body>
</html>
