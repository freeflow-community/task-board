<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task board</title>
<style>
  /* Tuned for a ~800px-wide embed. Everything is sized down from the
     comfortable desktop default; the two panes stack below 680px. */
  :root {
    --bg: #f0f1f3;
    --card: #ffffff;
    --line: #e6e8eb;
    --ink: #16181d;
    --muted: #8b9098;
    --accent: #2b6cf6;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 10px; background: var(--bg); color: var(--ink);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .app {
    max-width: 820px; margin: 0 auto; background: var(--card);
    border-radius: 10px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.07);
  }
  header {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 13px; border-bottom: 1px solid var(--line);
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #3fbf63; flex: none; }
  h1 { font-size: 14px; font-weight: 650; margin: 0; letter-spacing: -.15px; }
  .sub {
    font: 11px var(--mono); color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  header a { margin-left: auto; font-size: 11px; color: var(--muted); text-decoration: none; flex: none; }
  header a:hover { color: var(--accent); }

  .cols { display: grid; grid-template-columns: 1.35fr 1fr; min-height: 380px; }
  .left { border-right: 1px solid var(--line); min-width: 0; }
  .right { display: flex; flex-direction: column; min-width: 0; }

  .bar {
    display: flex; align-items: baseline; gap: 7px;
    padding: 7px 13px; border-bottom: 1px solid var(--line); background: #fafbfc;
  }
  .bar .label { font: 10px var(--mono); letter-spacing: .09em; color: var(--muted); text-transform: uppercase; }
  .bar .count { font: 10px var(--mono); color: var(--muted); }
  .controls { display: flex; gap: 6px; padding: 8px 13px; border-bottom: 1px solid var(--line); }
  input, select {
    font: 12px inherit; padding: 4px 7px; border: 1px solid var(--line);
    border-radius: 6px; background: #fff; color: var(--ink); outline: none; min-width: 0;
  }
  input { flex: 1; }
  input:focus, select:focus { border-color: var(--accent); }
  select { font-family: var(--mono); font-size: 11px; color: var(--muted); flex: none; }

  .row {
    display: grid; grid-template-columns: 22px 1fr auto; gap: 1px 8px;
    padding: 7px 13px; border-bottom: 1px solid var(--line); cursor: pointer;
  }
  .row:hover { background: #fafbfc; }
  .rank { grid-row: span 2; font: 10px var(--mono); color: var(--muted); padding-top: 2px; }
  .title {
    font-size: 12.5px; font-weight: 500; line-height: 1.35;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .age { font: 10px var(--mono); color: var(--muted); text-align: right; padding-top: 1px; }
  .meta {
    grid-column: 2 / 4; font: 10px var(--mono); color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .active { padding: 11px 13px; border-bottom: 1px solid var(--line); }
  .pill {
    display: inline-block; padding: 2px 6px; border-radius: 4px; background: var(--accent);
    color: #fff; font: 9.5px var(--mono); letter-spacing: .06em; font-weight: 600;
  }
  .active .head { display: flex; align-items: center; gap: 7px; }
  .active h2 { font-size: 13.5px; font-weight: 600; margin: 8px 0 0; letter-spacing: -.1px; line-height: 1.35; }
  .empty { padding: 24px 13px; text-align: center; color: var(--muted); font-size: 12px; }
  .empty .hint { font: 10px var(--mono); margin-top: 5px; opacity: .8; }

  .banner {
    padding: 6px 13px; background: #fff8e6; border-bottom: 1px solid #f0e2b8;
    font: 10px var(--mono); color: #7a5c12;
  }
  .err { padding: 14px; color: #b3261e; font: 11px var(--mono); }

  @media (max-width: 680px) {
    .cols { grid-template-columns: 1fr; }
    .left { border-right: none; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div class="app" id="app"><div class="empty">loading…</div></div>

<script>
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))

function age(iso) {
  const d = Math.floor((Date.now() - new Date(iso)) / 86400000)
  if (d < 1) return 'today'
  return d + 'd'
}

function metaLine(it) {
  const bits = ['#' + it.number, it.repo.split('/')[1]]
  for (const l of it.labels) bits.push(l.name)
  if (it.assignees.length) bits.push('@' + it.assignees[0])
  return bits.join(' · ')
}

function rowHTML(it, rank) {
  return `<div class="row" data-url="${esc(it.url)}" title="${esc(it.title)}">
    <div class="rank">${esc(rank)}</div>
    <div class="title">${esc(it.title)}</div>
    <div class="age">${esc(age(it.createdAt))}</div>
    <div class="meta">${esc(metaLine(it))}</div>
  </div>`
}

let BOARD = null
let filter = { q: '', status: 'all' }

function visible() {
  const q = filter.q.toLowerCase()
  return BOARD.items.filter((it) => {
    if (filter.status !== 'all' && (it.status ?? '—') !== filter.status) return false
    if (!q) return true
    return (it.title + ' ' + metaLine(it)).toLowerCase().includes(q)
  })
}

function render() {
  const items = visible()
  // Board order is the queue: whatever is In Progress is running, the rest wait.
  const active = items.find((it) => it.status === 'In Progress') ?? null
  const queue = items.filter((it) => it !== active)
  const statuses = [...new Set(BOARD.items.map((it) => it.status ?? '—'))]

  const app = document.getElementById('app')
  app.innerHTML = `
    <header>
      <span class="dot"></span>
      <h1>Task board</h1>
      <span class="sub">${esc(BOARD.title)}</span>
      <a href="${esc(BOARD.url)}" target="_blank">GitHub →</a>
    </header>
    ${BOARD.stale ? `<div class="banner">snapshot — no live server reachable</div>` : ''}
    <div class="cols">
      <div class="left">
        <div class="bar">
          <span class="label">Backlog</span>
          <span class="count">${queue.length} unscheduled</span>
        </div>
        <div class="controls">
          <input id="q" placeholder="Search" value="${esc(filter.q)}">
          <select id="status">
            <option value="all">All</option>
            ${statuses.map((s) => `<option value="${esc(s)}"${s === filter.status ? ' selected' : ''}>${esc(s)}</option>`).join('')}
          </select>
        </div>
        <div id="list">${queue.map((it, i) => rowHTML(it, i + 1)).join('') || '<div class="empty">nothing matches</div>'}</div>
      </div>
      <div class="right">
        <div class="active">
          ${active ? `
            <div class="head"><span class="pill">ACTIVE</span><span class="sub">#${active.number}</span></div>
            <h2>${esc(active.title)}</h2>
          ` : `<div class="empty">No active task<div class="hint">nothing is In Progress</div></div>`}
        </div>
        <div class="bar"><span class="label">Up next</span><span class="count">${Math.min(4, queue.length)}</span></div>
        <div class="next">${queue.slice(0, 4).map((it, i) => rowHTML(it, i + 1)).join('') || '<div class="empty">queue is empty</div>'}</div>
      </div>
    </div>`

  app.querySelectorAll('.row').forEach((r) =>
    r.addEventListener('click', () => window.open(r.dataset.url, '_blank')))

  const q = document.getElementById('q')
  q.addEventListener('input', (e) => { filter.q = e.target.value; render(); document.getElementById('q').focus() })
  document.getElementById('status').addEventListener('change', (e) => { filter.status = e.target.value; render() })
}

async function boot() {
  try {
    const res = await fetch('/api/board')
    if (!res.ok) throw new Error((await res.json()).error ?? res.statusText)
    BOARD = await res.json()
  } catch (err) {
    // No server (e.g. opened as a standalone artifact) — fall back to the
    // snapshot baked in at publish time, and say so.
    if (window.__SEED__) BOARD = { ...window.__SEED__, stale: true }
    else return document.getElementById('app').innerHTML =
      `<div class="err">could not load board: ${esc(err.message)}</div>`
  }
  render()
}
boot()
</script>
</body>
</html>
